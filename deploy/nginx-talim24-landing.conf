# talim24.uz — oddiy landing sahifa (bitta tugma: @mandatjavobbot)
# O'tish ballari webapp esa alohida portda: deploy/nginx-webapp.conf.example (9876)
#
# sudo ln -s /etc/nginx/sites-available/talim24-landing /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name talim24.uz www.talim24.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name talim24.uz www.talim24.uz;

    ssl_certificate /etc/letsencrypt/live/talim24.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talim24.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/mandat/mandat_stat/webapp/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
